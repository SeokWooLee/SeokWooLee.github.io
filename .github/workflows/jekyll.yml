# GitHub Pages 클래식 빌드는 리포지토리를 통째로 클론한 뒤 빌드하는데,
# 이 리포는 .git 히스토리가 947MB로 부풀어 10분 타임아웃을 넘기고 있다.
# Actions는 얕은 클론(actions/checkout 기본값)을 쓰고 타임아웃도 넉넉하다.
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # github-pages gem이 Actions 환경변수를 보고 baseurl을 /pages/<owner>로
      # 자동 주입한다. 이 사이트는 사용자 페이지(seokwoolee.github.io)라
      # baseurl이 비어 있어야 하므로 명시적으로 덮어쓴다.
      # url도 함께 고정해 canonical·sitemap·feed가 오염되지 않게 한다.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "" --config _config.yml
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: SeokWooLee/SeokWooLee.github.io

      # Google Search Console의 XML/RSS 처리 문제를 분리 진단하기 위해
      # 같은 URL 목록을 공식 지원되는 텍스트 사이트맵으로도 배포한다.
      - name: Generate text sitemap
        run: bundle exec ruby scripts/generate_sitemap_txt.rb _site/sitemap.xml _site/sitemap.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # deploy-pages의 timeout 상한은 600000ms(10분)다. 그보다 큰 값을
          # 주면 경고와 함께 상한으로 강제되므로, 배포를 10분 안에 끝내려면
          # 산출물 크기를 줄이는 수밖에 없다.
          timeout: 600000
